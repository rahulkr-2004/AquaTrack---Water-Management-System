# Application
spring.application.name=water

# Active Profile (set SPRING_PROFILES_ACTIVE=local for local dev, leave empty for cloud)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:}

# Server (binds to dynamic cloud PORT like 10000 on Render, or defaults to 8080)
server.port=${PORT:8080}

# Database Configuration (supports MySQL, PostgreSQL, Supabase via SPRING_DATASOURCE_URL, DATABASE_URL, or DB_URL)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:${DB_URL:jdbc:mysql://localhost:3306/water_billing_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}}}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Hibernate dialect (Leave empty for auto-detection between MySQL and PostgreSQL, or override via HIBERNATE_DIALECT)
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:}

# PostgreSQL + PgBouncer (Render) — disable server-side prepared statements to prevent
# "prepared statement S_1 already exists" error in transaction pooling mode
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.preparedStatementCacheQueries=0

# HikariCP connection pool tuning for Render free-tier (cold starts + DB sleep/wake)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# Flyway
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true

# JWT Configuration
app.jwt.secret=${JWT_SECRET:replace_this_with_a_secure_secret_key}
app.jwt.expiration-ms=86400000

# Email (SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Request size limits
server.tomcat.max-http-form-post-size=50MB
server.tomcat.max-swallow-size=50MB
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.codec.max-in-memory-size=50MB

# Razorpay Credentials
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
